name: CI

on:
  push:
    branches:
      - master
    tags:
      - release-major
      - release-minor
      - release-bugfix
  pull_request:
    branches:
      - master

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Determine version and release notes
      id: version
      run: |
        last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
        if [ "$GITHUB_REF_TYPE" != tag ]; then
          # Builds that are not released keep the last version
          last=${last:-v0.0.0}
          echo "version=${last#v}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git merge-base --is-ancestor HEAD origin/master; then
          echo "::error::$GITHUB_REF_NAME must point to a commit on master"
          exit 1
        fi
        # Release notes cover everything since the last release of the same level
        if [ -z "$last" ]; then
          version=2.0.0 base=
        else
          IFS=. read -r major minor bugfix <<< "${last#v}"
          case ${GITHUB_REF_NAME#release-} in
            major) version=$((major + 1)).0.0 pattern='v*.0.0' ;;
            minor) version=$major.$((minor + 1)).0 pattern='v*.*.0' ;;
            bugfix) version=$major.$minor.$((bugfix + 1)) pattern='v*' ;;
          esac
          base=$(git tag -l "$pattern" --sort=-v:refname | head -1)
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        {
          echo "notes<<EOF_NOTES"
          if [ -n "$base" ]; then
            echo "Changes since $base:"
            echo
            git log --no-merges --format='- %s (%h)' "$base..HEAD"
          else
            echo "First release with major.minor.bugfix version numbers."
          fi
          echo EOF_NOTES
        } >> "$GITHUB_OUTPUT"
        echo "Version $version, notes since ${base:-(none)}"

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: compiler version
      id: compiler
      run: echo "id=${ImageOS:-unknown}-$(c++ -dumpfullversion 2>/dev/null || c++ -dumpversion)" >> "$GITHUB_OUTPUT"
    - name: cache build
      uses: actions/cache@v6
      with:
        path: _build
        key: ${{ runner.os }}-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-cmake-04-build-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: ${{ runner.os }}-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-cmake-04-build-
    - name: apt update
      run: sudo apt-get -o Acquire::Retries=3 update
    - name: install opengl
      run: sudo apt-get -o Acquire::Retries=3 install mesa-common-dev libgl1-mesa-dev libgl1 libglx-mesa0 libxext-dev
    - name: install gtk
      run: sudo apt-get -o Acquire::Retries=3 install libgtk-3-dev
    - name: cmake
      run: |
        cmake -S . -B _build \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCPACK_PACKAGING_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DTREESHEETS_BUNDLE_WXWIDGETS=ON \
        -DwxUSE_SYS_LIBS=OFF \
        -DTREESHEETS_VERSION=${{ needs.version.outputs.version }}
    - name: build and package TreeSheets
      run: cmake --build _build --target package -j4
    - name: Remove epoch from .deb filename
      run: |
        shopt -s extglob
        for file in _build/treesheets_*:*.deb; do mv -v "${file}" "${file/_+([[:digit:]]):/_}"; done
    - name: Build AppImage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
        DEPLOY_GTK_VERSION: 3
        LINUXDEPLOY_OUTPUT_VERSION: ${{ needs.version.outputs.version }}
      run: |
        mkdir appimage && cd appimage
        DESTDIR=$PWD/AppDir cmake --install ../_build
        # TreeSheets looks for its data next to the executable before the absolute install paths
        ln -s ../share/doc/TreeSheets/docs ../share/doc/TreeSheets/examples ../share/TreeSheets/scripts AppDir/usr/bin/
        base=https://github.com/linuxdeploy
        curl -fsSLO $base/linuxdeploy/releases/download/continuous/linuxdeploy-$(uname -m).AppImage
        curl -fsSLO $base/linuxdeploy-plugin-gtk/raw/master/linuxdeploy-plugin-gtk.sh
        chmod +x linuxdeploy-*
        ./linuxdeploy-$(uname -m).AppImage --appdir AppDir --plugin gtk --output appimage \
          --desktop-file AppDir/usr/share/applications/com.strlen.TreeSheets.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/com.strlen.TreeSheets.svg
        mv TreeSheets-*.AppImage ../_build/
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-builds-${{ matrix.arch }}
        path: |
          _build/treesheets_*.deb
          _build/TreeSheets-*.AppImage
    - name: Remove CPack artifact
      run: rm -f _build/treesheets_*.deb _build/TreeSheets-*.AppImage

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: windows-latest
            extra_flags: "-A x64"
          - arch: arm64
            os: windows-11-vs2026-arm
            extra_flags: "-A ARM64 -DENABLE_LOBSTER=OFF" # tinycc currently does not fully support Windows on ARM
    steps:
    - uses: actions/checkout@v7
    - name: compiler version
      id: compiler
      shell: pwsh
      run: |
        # Updates of Visual Studio can change cl.exe within the same MSVC toolset directory
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion
        "id=$env:ImageOS-vs$vs" >> $env:GITHUB_OUTPUT
    - name: cache build
      uses: actions/cache@v6
      with:
        path: _build
        key: ${{ runner.os }}-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-cmake-04-build-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: ${{ runner.os }}-${{ matrix.arch }}-${{ steps.compiler.outputs.id }}-cmake-04-build-
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: cmake
      run: >
        cmake -S . -B _build
        -G "Visual Studio 18 2026"
        -DCMAKE_BUILD_TYPE=Release
        -DTREESHEETS_BUNDLE_WXWIDGETS=ON
        "-DTREESHEETS_VERSION=${{ needs.version.outputs.version }}"
        ${{ matrix.extra_flags }}
    - name: build and package
      run: cmake --build _build --config Release --target package -j
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-builds-${{ matrix.arch }}
        path: |
          _build/TreeSheets-*.exe
          _build/TreeSheets-*.zip
    - name: Remove CPack artifacts
      run: |
        Remove-Item -Path _build/TreeSheets-*.exe -Force
        Remove-Item -Path _build/TreeSheets-*.zip -Force
      shell: powershell


  build-mac:
    name: Build Mac
    needs: version
    runs-on: macos-latest
    env:
      minmac: 10.15
    steps:
    - uses: actions/checkout@v7
    - name: compiler version
      id: compiler
      run: echo "id=${ImageOS:-unknown}-$(c++ -dumpfullversion 2>/dev/null || c++ -dumpversion)" >> "$GITHUB_OUTPUT"
    - name: cache build
      uses: actions/cache@v6
      with:
        path: _build
        key: ${{ runner.os }}-${{ steps.compiler.outputs.id }}-cmake-04-build-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
        restore-keys: ${{ runner.os }}-${{ steps.compiler.outputs.id }}-cmake-04-build-
    - name: Prepare Plist
      run: /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion $minmac" platform/osx/Info.plist
    - name: cmake
      run: cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="$minmac" -DTREESHEETS_BUNDLE_WXWIDGETS=ON -DwxUSE_SYS_LIBS=OFF -DTREESHEETS_VERSION=${{ needs.version.outputs.version }}
    - name: Build and package TreeSheets
      run: cmake --build _build --target package -j4
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-disk-image
        path: _build/TreeSheets-*.dmg
    - name: Remove CPack artifact
      run: rm -f _build/TreeSheets-*.dmg

  release:
    name: Create release
    if: github.ref_type == 'tag'
    needs: [version, build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ needs.version.outputs.version }}
        commit: ${{ github.sha }}
        body: ${{ needs.version.outputs.notes }}
        makeLatest: true
        artifacts: "dist/*"
    - name: Remove release marker tag
      run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
      env:
        GH_TOKEN: ${{ github.token }}
